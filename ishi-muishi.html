];

// ══════════════════════════════════════════
//  CONJUGATION ENGINE
// ══════════════════════════════════════════
const GODAN_MAP = {
  'う': {a:'わ', i:'い', te:'って', ba:'え', e:'え', o:'お'},
  'く': {a:'か', i:'き', te:'いて', ba:'け', e:'け', o:'こ'},
  'ぐ': {a:'が', i:'ぎ', te:'いで', ba:'げ', e:'げ', o:'ご'},
  'す': {a:'さ', i:'し', te:'して', ba:'せ', e:'せ', o:'そ'},
  'つ': {a:'た', i:'ち', te:'って', ba:'て', e:'て', o:'と'},
  'ぬ': {a:'な', i:'に', te:'んで', ba:'ね', e:'ね', o:'の'},
  'ぶ': {a:'ば', i:'び', te:'んで', ba:'べ', e:'べ', o:'ぼ'},
  'む': {a:'ま', i:'み', te:'んで', ba:'め', e:'め', o:'も'},
  'る': {a:'ら', i:'り', te:'って', ba:'れ', e:'れ', o:'ろ'},
};

function getStem(v) { return v.w.slice(0, -1); }

// Returns full conjugation object for the 8 ishi-form fields
function conjugate(v) {
  const result = {};
  if (v.type === 'ichidan') {
    const base = getStem(v);
    result.causative = base + 'させる';
    result.passive   = base + 'られる';
    result.tai       = base + 'たい';
    result.request   = base + 'てください';
    result.prohibition = v.w + 'な';
    result.command   = base + 'ろ';
    result.potential = base + 'られる';
    result.volitional= base + 'よう';
  } else if (v.type === 'godan') {
    const base = getStem(v);
    const m = GODAN_MAP[v.end];
    const teForm = v.irregularTe ? base + 'って' : base + m.te;
    result.causative = base + m.a + 'せる';
    result.passive   = base + m.a + 'れる';
    result.tai       = base + m.i + 'たい';
    result.request   = teForm + 'ください';
    result.prohibition = v.w + 'な';
    result.command   = base + m.e;
    result.potential = base + m.e + 'る';
    result.volitional= base + m.o + 'う';
  } else if (v.type === 'suru') {
    const base = v.w.slice(0, -2);
    result.causative = base + 'させる';
    result.passive   = base + 'される';
    result.tai       = base + 'したい';
    result.request   = base + 'してください';
    result.prohibition = v.w + 'な';
    result.command   = base + 'しろ';
    result.potential = base + 'できる';
    result.volitional= base + 'しよう';
  } else if (v.type === 'kuru') {
    result.causative = '来させる';
    result.passive   = '来られる';
    result.tai       = '来たい';
    result.request   = '来てください';
    result.prohibition = '来るな';
    result.command   = '来い';
    result.potential = '来られる';
    result.volitional= '来よう';
  }
  return result;
}

const FORM_LABELS = {
  causative:  '使役形（〜せる／させる）',
  passive:    '受身形（〜れる／られる）',
  tai:        '希望形（〜たい）',
  request:    '依頼形（〜てください）',
  prohibition:'禁止形（〜な）',
  command:    '命令形',
  potential:  '可能形',
  volitional: '意向形（〜よう／おう）',
};

const FORM_ORDER = ['causative','passive','tai','request','prohibition','command','potential','volitional'];

const CAT_LABELS = {
  ishi: '意志動詞',
  muishi: '非意志動詞',
  dual: '意志非意志同形',
};

// ══════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════
let currentCategory = 'ishi';
let currentMode = 'judge';
let selectedChips = new Set(FORM_ORDER.slice());
let queue = [];
let currentIdx = 0;
let correctCount = 0;
let wrongCount = 0;
let wrongList = [];
let cardFlipped = false;
let answered = false;

// ══════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════
function getVerbsForCategory() {
  if (currentCategory === 'all') return VERBS;
  return VERBS.filter(v => v.cat === currentCategory);
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function buildQueue(retryWrong = false) {
  if (retryWrong) return [...wrongList];

  const verbs = getVerbsForCategory();

  if (currentMode === 'judge' || currentMode === 'flash') {
    return shuffle(verbs.map(v => ({ verb: v })));
  }

  if (currentMode === 'quiz') {
    // only verbs that have at least one applicable form (skip muishi verbs entirely for now,
    // since muishi verbs generally can't use these forms — handled with explanation cards instead)
    let items = [];
    const forms = [...selectedChips];
    if (forms.length === 0) return [];
    verbs.forEach(v => {
      forms.forEach(f => {
        items.push({ verb: v, form: f });
      });
    });
    return shuffle(items);
  }

  return [];
}

function updateStats() {
  document.getElementById('stat-correct').textContent = '✓ ' + correctCount;
  document.getElementById('stat-wrong').textContent = '✗ ' + wrongCount;
  document.getElementById('stat-total').textContent = '共 ' + queue.length + ' 題';
}

// ══════════════════════════════════════════
//  SETTINGS
// ══════════════════════════════════════════
function setCategory(c) {
  currentCategory = c;
  ['ishi','muishi','dual','all'].forEach(x => {
    const btn = document.getElementById('cat-'+x);
    btn.className = 'pill-btn';
    if (x === c) btn.classList.add('active-'+x);
  });
  restart();
}

function setMode(m) {
  currentMode = m;
  ['judge','flash','quiz','ref'].forEach(x => {
    const btn = document.getElementById('mode-'+x);
    btn.className = 'pill-btn';
    if (x === m) btn.classList.add('active-mode');
  });
  const ff = document.getElementById('form-filter');
  ff.style.display = (m === 'quiz') ? 'flex' : 'none';
  const ib = document.getElementById('info-box');
  ib.style.display = (m === 'ref') ? 'block' : 'none';
  restart();
}

function toggleForm(el) {
  const f = el.dataset.form;
  if (selectedChips.has(f)) {
    if (selectedChips.size <= 1) return;
    selectedChips.delete(f);
    el.classList.remove('selected');
  } else {
    selectedChips.add(f);
    el.classList.add('selected');
  }
  restart();
}

function selectAllForms() {
  document.querySelectorAll('.form-chip').forEach(el => {
    selectedChips.add(el.dataset.form);
    el.classList.add('selected');
  });
  restart();
}

function restart(retryWrong = false) {
  if (!retryWrong) {
    correctCount = 0;
    wrongCount = 0;
    wrongList = [];
  }
  queue = buildQueue(retryWrong);
  currentIdx = 0;
  answered = false;
  cardFlipped = false;
  updateStats();
  render();
}

// ══════════════════════════════════════════
//  RENDER DISPATCH
// ══════════════════════════════════════════
function render() {
  const area = document.getElementById('main-area');
  if (currentMode === 'ref') { renderRef(area); return; }

  if (queue.length === 0) {
    area.innerHTML = `<div class="empty-state"><div class="big">🤔</div><p>請至少選擇一種意志表現！</p></div>`;
    return;
  }
  if (currentIdx >= queue.length) { renderDone(area); return; }

  const progress = `<div class="progress-row">
    <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${(currentIdx/queue.length*100).toFixed(1)}%"></div></div>
    <span class="progress-label">${currentIdx}／${queue.length}</span>
  </div>`;

  if (currentMode === 'judge') renderJudge(area, progress);
  else if (currentMode === 'flash') renderFlash(area, progress);
  else if (currentMode === 'quiz') renderQuiz(area, progress);
}

// ══════════════════════════════════════════
//  JUDGE MODE — 分類判斷練習
// ══════════════════════════════════════════
function renderJudge(area, progress) {
  const item = queue[currentIdx];
  const v = item.verb;

  area.innerHTML = progress + `
  <div class="judge-card">
    <div class="judge-hint">這個動詞屬於哪一種？</div>
    <div class="judge-word">${v.w}</div>
    <div class="judge-reading">${v.r}</div>
    <div class="judge-zh">${v.zh}</div>
    <div class="judge-btns">
      <button class="judge-btn" id="judge-ishi" onclick="checkJudge('ishi')">意志動詞</button>
      <button class="judge-btn" id="judge-muishi" onclick="checkJudge('muishi')">非意志動詞</button>
      <button class="judge-btn" id="judge-dual" onclick="checkJudge('dual')">同形（兩者皆可）</button>
    </div>
    <div class="quiz-feedback" id="quiz-feedback"></div>
    <div class="quiz-explain" id="quiz-explain" style="display:none"></div>
    <div style="text-align:center">
      <button class="btn-next" id="btn-next" onclick="nextJudge()">下一題 →</button>
    </div>
  </div>`;
}

function checkJudge(pick) {
  if (answered) return;
  answered = true;
  const item = queue[currentIdx];
  const v = item.verb;
  const fb = document.getElementById('quiz-feedback');
  const explain = document.getElementById('quiz-explain');
  const btnNext = document.getElementById('btn-next');

  const pickBtn = document.getElementById('judge-' + pick);
  const correctBtn = document.getElementById('judge-' + v.cat);

  if (pick === v.cat) {
    fb.className = 'quiz-feedback ok';
    fb.textContent = '✓ 正確！這是「' + CAT_LABELS[v.cat] + '」';
    pickBtn.classList.add('sel-' + v.cat, 'right');
    correctCount++;
  } else {
    fb.className = 'quiz-feedback ng';
    fb.textContent = '✗ 不正確。正確答案是「' + CAT_LABELS[v.cat] + '」';
    pickBtn.classList.add('wrong-pick');
    correctBtn.classList.add('sel-' + v.cat, 'right');
    wrongCount++;
    wrongList.push(item);
  }

  document.querySelectorAll('.judge-btn').forEach(b => b.disabled = true);

  explain.style.display = 'block';
  explain.innerHTML = (v.note || '').replace(/\n/g, '<br>');

  btnNext.style.display = 'inline-block';
  updateStats();
}

function nextJudge() {
  currentIdx++;
  answered = false;
  render();
}

// ══════════════════════════════════════════
//  FLASHCARD MODE — 單字卡（意志表現一覽）
// ══════════════════════════════════════════
function renderFlash(area, progress) {
  const item = queue[currentIdx];
  const v = item.verb;
  const c = conjugate(v);

  let rows;
  if (v.noVolitionalForms) {
    rows = FORM_ORDER.map(f =>
      `<tr><td style="font-weight:700;color:#888">${FORM_LABELS[f]}</td><td class="ref-na-cell">— 非意志動詞，通常不使用</td></tr>`
    ).join('');
  } else {
    rows = FORM_ORDER.map(f =>
      `<tr><td style="font-weight:700;color:#888">${FORM_LABELS[f]}</td><td style="font-size:1.05rem">${c[f]}</td></tr>`
    ).join('');
  }

  area.innerHTML = progress + `
  <div class="flashcard-wrap">
    <div class="flashcard" onclick="flipCard()" style="cursor:pointer">
      <div class="card-prompt">點擊查看所有意志表現變化</div>
      <div class="card-word">${v.w}</div>
      <div class="card-reading">${v.r}</div>
      <div class="card-zh">${v.zh}</div>
      <div class="card-target ${v.cat}">${CAT_LABELS[v.cat]}</div>
      <div class="card-answer" id="card-answer">
        <table class="ref-table" style="text-align:left">
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="card-tap" id="card-tap">點擊卡片顯示變化表 👆</div>
    </div>
    <div class="btn-row" id="btn-row" style="display:none">
      <button class="btn-wrong" onclick="markWrong()">✗ 不熟</button>
      <button class="btn-correct" onclick="markCorrect()">✓ 熟悉了</button>
    </div>
  </div>`;
}

function flipCard() {
  if (cardFlipped) return;
  cardFlipped = true;
  document.getElementById('card-answer').classList.add('show');
  document.getElementById('card-tap').style.display = 'none';
  document.getElementById('btn-row').style.display = 'flex';
}

function markCorrect() {
  correctCount++;
  currentIdx++;
  cardFlipped = false;
  updateStats();
  render();
}

function markWrong() {
  wrongCount++;
  wrongList.push(queue[currentIdx]);
  currentIdx++;
  cardFlipped = false;
  updateStats();
  render();
}

// ══════════════════════════════════════════
//  QUIZ MODE — 變化填空
// ══════════════════════════════════════════
function renderQuiz(area, progress) {
  const item = queue[currentIdx];
  const v = item.verb;
  const form = item.form;
  const formLabel = FORM_LABELS[form];

  if (v.noVolitionalForms) {
    // Skip generating an answer field; show as an explanation card
    area.innerHTML = progress + `
    <div class="quiz-card">
      <div class="quiz-target-label">
        「<strong>${v.w}</strong>」（${v.r}）${v.zh} 的
        <span class="quiz-target-form muishi">${formLabel}</span>
      </div>
      <div class="quiz-feedback ng" style="margin-top:0">⚠️ 這是非意志動詞，通常不會使用「${formLabel}」這種意志表現。</div>
      <div class="quiz-explain">${(v.note||'').replace(/\n/g,'<br>')}<br><br>非意志動詞無法用意志控制，因此基本上不會用於「使役・受身・希望・依頼・禁止・命令・可能・意向」等意志表現中。</div>
      <div style="text-align:center">
        <button class="btn-submit" onclick="nextQuiz(true)">我了解了，下一題 →</button>
      </div>
    </div>`;
    return;
  }

  const c = conjugate(v);

  area.innerHTML = progress + `
  <div class="quiz-card">
    <div class="quiz-target-label">
      「<strong>${v.w}</strong>」（${v.r}）${v.zh} 的
      <span class="quiz-target-form ${v.cat}">${formLabel}</span>
      是什麼？
    </div>
    <input class="quiz-input" id="quiz-input" type="text" placeholder="輸入答案…" onkeydown="if(event.key==='Enter')checkQuiz()">
    <div><button class="btn-submit" onclick="checkQuiz()">確認</button>
    <button class="btn-next" id="btn-next" onclick="nextQuiz()">下一題 →</button></div>
    <div class="quiz-feedback" id="quiz-feedback"></div>
    <div class="quiz-answer-reveal" id="quiz-reveal"></div>
    ${v.cat === 'dual' ? `<div class="quiz-explain">「${v.w}」是意志非意志同形動詞：${(v.note||'').replace(/\n/g,'<br>')}</div>` : ''}
  </div>`;

  setTimeout(() => { const inp = document.getElementById('quiz-input'); if(inp) inp.focus(); }, 50);
}

function checkQuiz() {
  if (answered) return;
  const item = queue[currentIdx];
  const v = item.verb;
  const c = conjugate(v);
  const answer = c[item.form];
  const input = document.getElementById('quiz-input');
  const val = input.value.trim();
  const fb = document.getElementById('quiz-feedback');
  const rev = document.getElementById('quiz-reveal');
  const btnNext = document.getElementById('btn-next');

  if (val === answer) {
    input.classList.add('correct-input');
    fb.className = 'quiz-feedback ok';
    fb.textContent = '✓ 正確！';
    correctCount++;
  } else {
    input.classList.add('wrong-input');
    fb.className = 'quiz-feedback ng';
    fb.textContent = '✗ 不正確';
    rev.textContent = `正確答案：${answer}`;
    wrongCount++;
    wrongList.push(item);
  }
  answered = true;
  btnNext.style.display = 'inline-block';
  updateStats();
}

function nextQuiz(skipped) {
  if (skipped) {
    // muishi explanation card counted as "correct" pass-through, doesn't affect stats
  }
  currentIdx++;
  answered = false;
  render();
}

// ══════════════════════════════════════════
//  DONE SCREEN
// ══════════════════════════════════════════
function renderDone(area) {
  const total = correctCount + wrongCount;
  const pct = total > 0 ? Math.round(correctCount / total * 100) : 0;
  let emoji = pct >= 90 ? '🎉' : pct >= 70 ? '👍' : pct >= 50 ? '💪' : '📖';
  area.innerHTML = `<div class="done-state">
    <div class="big">${emoji}</div>
    <h2>練習完成！</h2>
    <p>正確 ${correctCount} 題，錯誤 ${wrongCount} 題（正確率 ${pct}%）</p>
    ${wrongCount > 0 ? `<button class="btn-retry-wrong" onclick="restart(true)">重練錯題（${wrongCount}題）</button>` : ''}
    <button class="btn-restart" onclick="restart(false)">重新開始</button>
  </div>`;
}

// ══════════════════════════════════════════
//  REFERENCE TABLE
// ══════════════════════════════════════════
function renderRef(area) {
  const verbs = getVerbsForCategory();

  let html = verbs.map((v, idx) => {
    const rows = FORM_ORDER.map(f => {
      if (v.noVolitionalForms) {
        return `<tr><td style="font-weight:700;color:#888;width:40%">${FORM_LABELS[f]}</td><td class="ref-na-cell">—（非意志動詞，通常不使用）</td></tr>`;
      }
      const c = conjugate(v);
      return `<tr><td style="font-weight:700;color:#888;width:40%">${FORM_LABELS[f]}</td><td style="font-size:1rem">${c[f]}</td></tr>`;
    }).join('');

    const noteHtml = v.note ? `<div style="padding:10px 18px;font-size:0.8rem;color:#888;line-height:1.7;border-bottom:1px solid #f0f0f0">${v.note.replace(/\n/g,'<br>')}</div>` : '';

    return `<div class="ref-table-wrap" style="margin-bottom:10px">
      <div class="ref-verb-header ${v.cat}" onclick="toggleRefItem(${idx})" style="cursor:pointer">
        <span class="ref-chevron" id="ref-chevron-${idx}">›</span>
        <span>${v.w}（${v.r}）— ${v.zh}</span>
        <span class="cat-tag">${CAT_LABELS[v.cat]}</span>
      </div>
      <div class="ref-detail" id="ref-detail-${idx}" style="display:none">
        ${noteHtml}
        <table class="ref-table"><tbody>${rows}</tbody></table>
      </div>
    </div>`;
  }).join('');

  area.innerHTML = `
    <input class="ref-search" id="ref-search" placeholder="搜尋動詞（日文或中文）…" oninput="filterRef(this.value)">
    <div id="ref-content">${html}</div>`;
}

function toggleRefItem(idx) {
  const detail = document.getElementById('ref-detail-' + idx);
  const chevron = document.getElementById('ref-chevron-' + idx);
  const open = detail.style.display !== 'none';
  detail.style.display = open ? 'none' : 'block';
  chevron.classList.toggle('open', !open);
}

function filterRef(val) {
  const v = val.trim().toLowerCase();
  document.querySelectorAll('#ref-content .ref-table-wrap').forEach(el => {
    const header = el.querySelector('.ref-verb-header').textContent.toLowerCase();
    el.style.display = !v || header.includes(v) ? '' : 'none';
  });
}

// ══════════════════════════════════════════
//  THEME
// ══════════════════════════════════════════
const THEME_ORDER = ['light', 'dark', 'gray'];

function setTheme(t) {
  document.body.classList.remove('dark', 'grayscale');
  if (t === 'dark') document.body.classList.add('dark');
  else if (t === 'gray') document.body.classList.add('grayscale');

  document.getElementById('theme-icon-sun').style.display = t === 'light' ? 'block' : 'none';
  document.getElementById('theme-icon-moon').style.display = t === 'dark' ? 'block' : 'none';
  document.getElementById('theme-icon-gray').style.display = t === 'gray' ? 'block' : 'none';

  const btn = document.getElementById('theme-cycle-btn');
  const titles = { light: '亮色模式（點擊切換深色）', dark: '深色模式（點擊切換黑白）', gray: '黑白模式（點擊切換亮色）' };
  btn.title = titles[t];

  try { localStorage.setItem('ishi-muishi-theme', t); } catch(e) {}
}

function cycleTheme() {
  const current = THEME_ORDER.find(t => {
    if (t === 'light') return !document.body.classList.contains('dark') && !document.body.classList.contains('grayscale');
    if (t === 'dark') return document.body.classList.contains('dark');
    if (t === 'gray') return document.body.classList.contains('grayscale');
  }) || 'light';
  const next = THEME_ORDER[(THEME_ORDER.indexOf(current) + 1) % THEME_ORDER.length];
  setTheme(next);
}

// ══════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════
(function(){
  try {
    const saved = localStorage.getItem('ishi-muishi-theme');
    setTheme(saved && THEME_ORDER.includes(saved) ? saved : 'light');
  } catch(e) { setTheme('light'); }
})();
restart();

</script>
</body>
</html>
