<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>複合動詞 記憶工具</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f6f2;--surface:#fff;--surface2:#f0efe9;
  --border:#e2e0d8;--border2:#c8c6bc;
  --text:#1a1916;--text2:#6b6960;--text3:#9b9990;
  --purple:#534AB7;--purple-light:#EEEDFE;--purple-mid:#AFA9EC;
  --teal:#0F6E56;--teal-light:#E1F5EE;
  --coral:#993C1D;--coral-light:#FAECE7;
  --green:#1D9E75;--red:#D85A30;
  --radius:10px;--radius-lg:14px;
}
body.dark{
  --bg:#111110;--surface:#1c1c1a;--surface2:#252523;
  --border:#2e2e2b;--border2:#3a3a37;
  --text:#f0efe9;--text2:#a8a69e;--text3:#6b6960;
  --purple:#7F77DD;--purple-light:#2a2848;--purple-mid:#534AB7;
  --teal:#2DC896;--teal-light:#0d2e22;
  --coral:#F07050;--coral-light:#2e1a12;
  --green:#2DC896;--red:#F07050;
}
html,body{height:100%;font-family:'Noto Sans JP','Noto Sans TC',sans-serif;color:var(--text);background:var(--bg)}

/* ── Desktop layout ── */
.shell{display:flex;height:100vh;overflow:hidden}
.sidebar{
  width:250px;flex-shrink:0;
  background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;height:100vh;overflow:hidden;
  transition:width .25s ease;
}
.sidebar.collapsed{width:48px}
.sidebar.collapsed .sidebar-header p,
.sidebar.collapsed .stats-row,
.sidebar.collapsed .chapter-list,
.sidebar.collapsed .sidebar-actions,
.sidebar.collapsed .ci-wrap,
.sidebar.collapsed .ci-count{display:none}
.sidebar.collapsed .sidebar-header{padding:10px 8px;display:flex;align-items:center;justify-content:center}
.sidebar.collapsed .sidebar-header h1{display:none}
.sidebar-toggle{
  background:none;border:none;cursor:pointer;
  padding:4px 6px;border-radius:6px;color:var(--text3);
  font-size:16px;line-height:1;flex-shrink:0;
  transition:background .12s;
}
.sidebar-toggle:hover{background:var(--surface2);color:var(--text)}
.main{flex:1;overflow-y:auto;padding:2rem;max-width:780px}

/* Sidebar */
.sidebar-header{padding:1.25rem 1rem 0.75rem;border-bottom:1px solid var(--border)}
.sidebar-header h1{font-size:14px;font-weight:700;color:var(--text)}
.sidebar-header p{font-size:11px;color:var(--text3);margin-top:2px}
.stats-row{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--border)}
.stat-pill{flex:1;background:var(--surface2);border-radius:7px;padding:5px 4px;text-align:center}
.stat-pill .n{font-size:16px;font-weight:700;color:var(--purple)}
.stat-pill .l{font-size:10px;color:var(--text3)}
.chapter-list{flex:1;overflow-y:auto;padding:4px 0}
.chapter-item{
  padding:7px 10px;cursor:pointer;
  display:flex;align-items:center;gap:6px;
  border-left:3px solid transparent;transition:background .1s;
}
.chapter-item:hover{background:var(--surface2)}
.chapter-item.active{background:var(--purple-light);border-left-color:var(--purple)}
.chapter-item.active .ci-name{color:var(--purple)}
.ci-wrap{flex:1;min-width:0}
.ci-name{font-size:13px;font-weight:500;color:var(--text)}
.ci-prog{height:2px;background:var(--border);border-radius:2px;margin-top:3px;overflow:hidden}
.ci-prog-bar{height:100%;background:var(--purple);border-radius:2px}
.ci-count{font-size:10px;color:var(--text3);white-space:nowrap}
.sidebar-actions{padding:8px 10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:5px}
.sa-btn{
  width:100%;padding:7px 10px;font-size:12px;border-radius:7px;
  border:1px solid var(--border2);background:transparent;cursor:pointer;
  color:var(--text);text-align:left;font-family:inherit;transition:background .1s;
}
.sa-btn:hover{background:var(--surface2)}
.sa-btn.purple{background:var(--purple-light);border-color:var(--purple-mid);color:var(--purple)}
.sa-btn.purple:hover{background:#CECBF6}
.sa-btn.red{background:var(--coral-light);border-color:#F5C4B3;color:var(--coral)}
.sa-btn.red:hover{background:#F5C4B3}

/* ── Mobile top-bar (hidden on desktop) ── */
.mobile-topbar{
  display:none;
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:10px 14px;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
}
.mobile-topbar h1{font-size:14px;font-weight:700;color:var(--text)}
.mobile-menu-btn{
  border:none;background:none;cursor:pointer;font-size:20px;
  color:var(--text2);padding:4px;line-height:1;
}
/* Theme & top-right toolbar */
.toolbar{
  position:fixed;top:12px;right:16px;z-index:300;
  display:flex;gap:6px;
}
.tool-btn{
  width:36px;height:36px;border-radius:50%;
  background:var(--surface);border:1px solid var(--border2);
  cursor:pointer;font-size:16px;display:flex;align-items:center;
  justify-content:center;color:var(--text2);
  box-shadow:0 1px 4px rgba(0,0,0,.12);
  transition:background .12s,color .12s;
}
.tool-btn:hover{background:var(--surface2);color:var(--text)}
@media(max-width:680px){
  .toolbar{top:8px;right:52px}
}
/* Mobile drawer overlay */
.drawer-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;
}
.drawer-overlay.open{display:block}
.drawer{
  position:fixed;left:0;top:0;bottom:0;width:280px;
  background:var(--surface);display:flex;flex-direction:column;
  z-index:201;transform:translateX(-100%);transition:transform .25s;
  box-shadow:4px 0 20px rgba(0,0,0,.15);
}
.drawer.open{transform:translateX(0)}
.drawer-close{
  position:absolute;top:12px;right:12px;border:none;background:none;
  cursor:pointer;font-size:20px;color:var(--text3);
}
.drawer .sidebar-header{padding-top:1rem}
.drawer .chapter-list{flex:1;overflow-y:auto;padding:4px 0}

/* Main content */
.main{flex:1;overflow-y:auto;padding:2rem}
.page-header{display:flex;align-items:center;gap:8px;margin-bottom:1.25rem;flex-wrap:wrap}
.back-btn{
  border:none;background:none;cursor:pointer;color:var(--text3);
  font-size:13px;padding:4px 8px;border-radius:6px;font-family:inherit;
}
.back-btn:hover{background:var(--surface2);color:var(--text)}
.page-title{font-size:20px;font-weight:700;color:var(--text)}
.page-sub{font-size:13px;color:var(--text3);font-weight:400}

/* Mode tabs */
.mode-tabs{
  display:flex;gap:3px;margin-bottom:1.25rem;
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:3px;width:fit-content;
}
.mode-tab{
  padding:7px 16px;font-size:13px;font-weight:500;
  border:none;background:transparent;border-radius:7px;
  cursor:pointer;color:var(--text2);font-family:inherit;transition:all .15s;
}
.mode-tab.active{background:var(--purple);color:#fff}
.mode-tab:not(.active):hover{background:var(--surface2);color:var(--text)}

/* Flashcard */
.fc-progress{height:4px;background:var(--border);border-radius:2px;margin-bottom:1rem;overflow:hidden}
.fc-progress-bar{height:100%;background:var(--purple);border-radius:2px;transition:width .3s}
.flashcard{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:2rem 1.75rem;
  cursor:pointer;user-select:none;min-height:240px;
  display:flex;flex-direction:column;justify-content:center;
  transition:border-color .15s;position:relative;
}
.flashcard:hover{border-color:var(--border2)}
.fc-chapter-tag{
  position:absolute;top:12px;right:14px;
  font-size:11px;background:var(--surface2);border-radius:20px;
  padding:2px 9px;color:var(--text3);
}
.fc-front{text-align:center}
.fc-verb{font-size:48px;font-weight:700;color:var(--text);margin-bottom:6px}
.fc-kana{font-size:17px;color:var(--text3);letter-spacing:.1em}
.fc-hint{font-size:12px;color:var(--text3);margin-top:1.5rem}
.fc-back{display:none}
.flashcard.flipped .fc-front{display:none}
.flashcard.flipped .fc-back{display:block}
.fc-meaning{font-size:24px;font-weight:700;color:var(--text);margin-bottom:8px}
.badge{display:inline-block;font-size:12px;padding:3px 12px;border-radius:20px;font-weight:500;margin-bottom:10px}
.badge-ta{background:var(--purple-light);color:var(--purple)}
.badge-ji{background:var(--teal-light);color:var(--teal)}
.fc-example{
  font-size:14px;color:var(--text2);line-height:1.8;
  background:var(--surface2);border-radius:8px;
  padding:11px 14px;margin-bottom:8px;
}
.fc-particle{font-size:13px;color:var(--text3)}
.fc-particle b{color:var(--text);font-weight:500}
.fc-nav{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:12px;flex-wrap:wrap;gap:8px;
}
.fc-counter{font-size:13px;color:var(--text3)}
.fc-btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{
  padding:7px 14px;font-size:13px;border-radius:8px;
  border:1px solid var(--border2);background:transparent;
  cursor:pointer;color:var(--text);font-family:inherit;
  transition:background .12s;font-weight:500;
}
.btn:hover{background:var(--surface2)}
.btn:disabled{opacity:.35;cursor:default}
.btn-know{color:var(--teal);border-color:#9FE1CB}
.btn-know:hover{background:var(--teal-light)}
.btn-dunno{color:var(--coral);border-color:#F5C4B3}
.btn-dunno:hover{background:var(--coral-light)}

/* Quiz */
.quiz-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.75rem}
.quiz-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px}
.quiz-q{font-size:13px;color:var(--text3)}
.quiz-score-badge{font-size:12px;background:var(--surface2);border-radius:20px;padding:3px 10px;color:var(--text2)}
.quiz-verb{font-size:42px;font-weight:700;color:var(--text);margin-bottom:4px}
.quiz-kana{font-size:15px;color:var(--text3);letter-spacing:.08em;margin-bottom:1.25rem}
.quiz-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.quiz-opt{
  padding:12px 12px;font-size:14px;line-height:1.5;
  border:1px solid var(--border2);border-radius:8px;
  background:transparent;cursor:pointer;text-align:left;
  color:var(--text);font-family:inherit;transition:all .12s;font-weight:500;
}
.quiz-opt:hover:not(:disabled){background:var(--surface2)}
.quiz-opt.correct{background:var(--teal-light)!important;border-color:var(--green)!important;color:var(--teal)!important}
.quiz-opt.wrong{background:var(--coral-light)!important;border-color:var(--red)!important;color:var(--coral)!important}
.quiz-opt:disabled{cursor:default}
.quiz-feedback{font-size:14px;padding:11px 14px;border-radius:8px;margin-bottom:10px;display:none;line-height:1.7}
.quiz-feedback.show{display:block}
.quiz-feedback.ok{background:var(--teal-light);color:var(--teal)}
.quiz-feedback.ng{background:var(--coral-light);color:var(--coral)}
.quiz-next{
  width:100%;padding:10px;font-size:14px;font-weight:500;
  border-radius:8px;border:1px solid var(--border2);
  background:transparent;cursor:pointer;color:var(--text);
  font-family:inherit;display:none;transition:background .12s;
}
.quiz-next.show{display:block}
.quiz-next:hover{background:var(--surface2)}

/* Result */
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:2rem;text-align:center}
.result-score{font-size:60px;font-weight:700;color:var(--purple);line-height:1}
.result-label{font-size:14px;color:var(--text3);margin-top:6px;margin-bottom:1.5rem}
.result-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1.5rem}
.rs{background:var(--surface2);border-radius:8px;padding:12px 6px}
.rs .n{font-size:24px;font-weight:700;color:var(--text)}
.rs .l{font-size:11px;color:var(--text3);margin-top:3px}
.result-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.result-actions .btn{padding:9px 18px;font-size:14px}
.btn-primary{background:var(--purple);border-color:var(--purple);color:#fff!important}
.btn-primary:hover{background:#3C3489!important;border-color:#3C3489!important}
.btn-danger{color:var(--coral)!important;border-color:#F5C4B3!important}
.btn-danger:hover{background:var(--coral-light)!important}

/* List */
.list-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.list-search{
  padding:8px 11px;font-size:14px;border:1px solid var(--border2);
  border-radius:8px;background:var(--surface);color:var(--text);
  font-family:inherit;flex:1;min-width:0;
}
.list-search:focus{outline:none;border-color:var(--purple)}
.list-item{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.list-item:last-child{border-bottom:none}
.li-verb-wrap{min-width:100px}
.li-verb{font-size:19px;font-weight:700;color:var(--text)}
.li-kana{font-size:11px;color:var(--text3);margin-top:2px;letter-spacing:.05em}
.li-body{flex:1;min-width:0}
.li-meaning{font-size:14px;font-weight:500;color:var(--text);margin-bottom:3px}
.li-ex{font-size:12px;color:var(--text2);line-height:1.7;word-break:break-all}
.li-meta{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.li-badge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500}
.li-ta{background:var(--purple-light);color:var(--purple)}
.li-ji{background:var(--teal-light);color:var(--teal)}
.li-p{background:var(--surface2);color:var(--text3)}
.li-check{
  width:26px;height:26px;border-radius:50%;flex-shrink:0;margin-top:2px;
  border:1px solid var(--border2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  background:transparent;transition:all .12s;font-size:13px;
}
.li-check:hover{background:var(--surface2)}
.li-check.known{background:var(--teal-light);border-color:var(--green);color:var(--teal)}

/* Home overview */
.overview-summary{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:1.25rem 1.5rem;
  margin-bottom:1.5rem;display:flex;gap:1.5rem;align-items:center;flex-wrap:wrap;
}
.ov-n{font-size:36px;font-weight:700;color:var(--purple)}
.ov-l{font-size:12px;color:var(--text3);margin-top:1px}
.ov-divider{width:1px;height:36px;background:var(--border);flex-shrink:0}
.ov-actions{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}
.overview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:9px}
.ch-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:.9rem 1rem;
  cursor:pointer;transition:all .15s;
}
.ch-card:hover{border-color:var(--border2);transform:translateY(-1px)}
.ch-card .cc-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:1px}
.ch-card .cc-sub{font-size:11px;color:var(--text3)}
.ch-card .cc-prog{height:3px;background:var(--border);border-radius:2px;margin-top:8px;overflow:hidden}
.ch-card .cc-bar{height:100%;background:var(--purple);border-radius:2px}
.ch-card .cc-pct{font-size:12px;color:var(--text3);margin-top:4px}
.section-label{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;margin-top:1.5rem}
.card-area{min-height:280px}
.empty{text-align:center;padding:3rem;color:var(--text3);font-size:14px}

/* ── Mobile ── */
@media(max-width:680px){
  .shell{flex-direction:column;height:auto;overflow:visible}
  .sidebar{display:none} /* hidden – use drawer instead */
  .mobile-topbar{display:flex}
  .main{overflow-y:visible;padding:14px}
  .fc-verb{font-size:34px}
  .quiz-verb{font-size:30px}
  .quiz-opts{grid-template-columns:1fr}
  .result-grid{grid-template-columns:1fr 1fr}
  .result-score{font-size:48px}
  .overview-summary{gap:1rem;padding:1rem}
  .ov-actions{margin-left:0;width:100%}
  .ov-actions .btn{flex:1;text-align:center;justify-content:center;font-size:13px}
  .overview-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .fc-btns{width:100%;justify-content:space-between}
  .fc-btns .btn{flex:1;text-align:center;font-size:12px;padding:7px 6px}
  .li-verb-wrap{min-width:80px}
  .mode-tabs{width:100%}
  .mode-tab{flex:1;text-align:center}
}
</style>
</head>
<body>

<!-- Mobile top bar -->
<div class="mobile-topbar">
  <h1>複合動詞 記憶工具</h1>
  <button class="mobile-menu-btn" onclick="openDrawer()">☰</button>
</div>

<!-- Mobile drawer overlay + panel -->
<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <button class="drawer-close" onclick="closeDrawer()">✕</button>
  <div class="sidebar-header">
    <h1>複合動詞 記憶工具</h1>
    <p>183 個動詞・31 章節・N2 程度</p>
  </div>
  <div class="stats-row">
    <div class="stat-pill"><div class="n" id="ds-known">0</div><div class="l">已記住</div></div>
    <div class="stat-pill"><div class="n" id="ds-pct">0%</div><div class="l">總進度</div></div>
    <div class="stat-pill"><div class="n" id="ds-wrong">0</div><div class="l">錯題數</div></div>
  </div>
  <div class="chapter-list" id="drawer-chapter-list"></div>
  <div class="sidebar-actions">
    <button class="sa-btn purple" onclick="closeDrawer();startAll('flash')">▶ 全部閃卡</button>
    <button class="sa-btn" onclick="closeDrawer();startAll('quiz')">✎ 全部測驗</button>
    <button class="sa-btn red" onclick="closeDrawer();reviewWeak()">↩ 複習錯題</button>
  </div>
</div>

<div class="shell">
  <!-- Desktop sidebar -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header" style="display:flex;align-items:center;justify-content:space-between;gap:6px">
      <div>
        <h1>複合動詞 記憶工具</h1>
        <p>183 個動詞・31 章節・N2 程度</p>
      </div>
      <button class="sidebar-toggle" id="sidebar-toggle" onclick="toggleSidebar()" title="收合側欄">◀</button>
    </div>
    <div class="stats-row">
      <div class="stat-pill"><div class="n" id="s-known">0</div><div class="l">已記住</div></div>
      <div class="stat-pill"><div class="n" id="s-pct">0%</div><div class="l">總進度</div></div>
      <div class="stat-pill"><div class="n" id="s-wrong">0</div><div class="l">錯題數</div></div>
    </div>
    <div class="chapter-list" id="chapter-list"></div>
    <div class="sidebar-actions">
      <button class="sa-btn purple" onclick="startAll('flash')">▶ 全部閃卡</button>
      <button class="sa-btn" onclick="startAll('quiz')">✎ 全部測驗</button>
      <button class="sa-btn red" onclick="reviewWeak()">↩ 複習錯題</button>
    </div>
  </nav>

  <!-- Main -->
  <main class="main" id="main">
    <div id="home-area">
      <div style="margin-bottom:1.25rem">
        <div style="font-size:22px;font-weight:700;color:var(--text);margin-bottom:3px">選擇章節開始學習</div>
        <div style="font-size:13px;color:var(--text3)">點擊章節卡片，或使用下方快速入口</div>
      </div>
      <div class="overview-summary">
        <div><div class="ov-n" id="ov-known">0</div><div class="ov-l">已記住單字</div></div>
        <div class="ov-divider"></div>
        <div><div class="ov-n" style="color:var(--text)">183</div><div class="ov-l">總單字數</div></div>
        <div class="ov-divider"></div>
        <div><div class="ov-n" style="color:var(--text)">31</div><div class="ov-l">章節數</div></div>
        <div class="ov-actions">
          <button class="btn btn-primary" onclick="startAll('flash')">全部閃卡</button>
          <button class="btn" onclick="startAll('quiz')">全部測驗</button>
          <button class="btn btn-danger" onclick="reviewWeak()">複習錯題</button>
        </div>
      </div>
      <div class="section-label">所有章節</div>

const chapters = Object.keys(DATA);
const allCards = chapters.flatMap(ch => DATA[ch].map(w => ({...w, chapter:ch})));

let known = JSON.parse(localStorage.getItem('vv_known')||'{}');
let wrong  = JSON.parse(localStorage.getItem('vv_wrong') ||'{}');
let curChapter = null, curMode = 'flash', curCards = [], curIdx = 0;
let quizScore = 0, quizTotal = 0;
// Map: quiz option index → word name (avoids textContent comparison bug)
let quizOptNames = [];

function save() {
  localStorage.setItem('vv_known', JSON.stringify(known));
  localStorage.setItem('vv_wrong',  JSON.stringify(wrong));
}

function totalKnown() { return allCards.filter(w => known[w.name]).length; }
function totalWrong() { return allCards.filter(w => wrong[w.name]).length; }

function updateStats() {
  const tk = totalKnown(), tw = totalWrong(), total = allCards.length;
  const pct = Math.round(tk/total*100)+'%';
  ['s-known','ds-known'].forEach(id => { const el=document.getElementById(id); if(el) el.textContent=tk; });
  ['s-pct','ds-pct'].forEach(id => { const el=document.getElementById(id); if(el) el.textContent=pct; });
  ['s-wrong','ds-wrong'].forEach(id => { const el=document.getElementById(id); if(el) el.textContent=tw; });
  const ovk = document.getElementById('ov-known'); if(ovk) ovk.textContent=tk;
}

function chapterProgress(ch) {
  const words = DATA[ch], total = words.length;
  const k = words.filter(w => known[w.name]).length;
  return {k, total, pct: Math.round(k/total*100)};
}

function chapterItemHTML(ch, i, activeClass) {
  const {k, total, pct} = chapterProgress(ch);
  return '<div class="chapter-item' + activeClass + '" onclick="selectChapterByIndex(' + i + ')">'
    + '<div class="ci-wrap">'
    + '<div class="ci-name">' + ch + '</div>'
    + '<div class="ci-prog"><div class="ci-prog-bar" style="width:' + pct + '%"></div></div>'
    + '</div>'
    + '<div class="ci-count">' + k + '/' + total + '</div>'
    + '</div>';
}

function renderSidebar() {
  const html = chapters.map((ch,i) => chapterItemHTML(ch, i, curChapter===ch?' active':'')).join('');
  const el1 = document.getElementById('chapter-list');      if(el1) el1.innerHTML = html;
  const el2 = document.getElementById('drawer-chapter-list'); if(el2) el2.innerHTML = html;
}

function renderOverview() {
  const grid = document.getElementById('ov-grid');
  if(!grid) return;
  grid.innerHTML = chapters.map((ch, i) => {
    const {k, total, pct} = chapterProgress(ch);
    return '<div class="ch-card" onclick="selectChapterByIndex(' + i + ')">'
      + '<div class="cc-title">' + ch + '</div>'
      + '<div class="cc-sub">' + total + ' 個動詞</div>'
      + '<div class="cc-prog"><div class="cc-bar" style="width:' + pct + '%"></div></div>'
      + '<div class="cc-pct">' + k + ' / ' + total + ' 已記住</div>'
      + '</div>';
  }).join('');
}


function openDrawer()  { document.getElementById('drawer').classList.add('open'); document.getElementById('drawer-overlay').classList.add('open'); }
function closeDrawer() { document.getElementById('drawer').classList.remove('open'); document.getElementById('drawer-overlay').classList.remove('open'); }

function goStudy(title, sub, cards) {
  document.getElementById('home-area').style.display  = 'none';
  document.getElementById('study-area').style.display = 'block';
  document.getElementById('study-title').textContent  = title;
  document.getElementById('study-sub').textContent    = sub;
  curCards = cards;
  setMode('flash');
  renderSidebar();
  updateStats();
  window.scrollTo(0,0);
}

function selectChapterByIndex(i) { selectChapter(chapters[i]); }
function selectChapter(ch) {
  curChapter = ch;
  closeDrawer();
  goStudy(ch, DATA[ch].length+' 個', DATA[ch].map(w=>({...w,chapter:ch})));
}

function startAll(mode) {
  curChapter = 'all';
  goStudy('全部單字', allCards.length+' 個', [...allCards]);
  setMode(mode);
}

function reviewWeak() {
  const weak = allCards.filter(w => wrong[w.name]);
  if (!weak.length) { alert('目前沒有錯題記錄！先完成測驗再來複習。'); return; }
  curChapter = 'review';
  closeDrawer();
  goStudy('複習錯題', weak.length+' 個', weak);
}

function backToHome() {
  document.getElementById('home-area').style.display  = 'block';
  document.getElementById('study-area').style.display = 'none';
  curChapter = null;
  renderSidebar(); renderOverview(); updateStats();
}

function setMode(mode) {
  curMode = mode; curIdx = 0; quizScore = 0; quizTotal = 0;
  document.querySelectorAll('.mode-tab').forEach((t,i) => {
    t.classList.toggle('active', ['flash','quiz','kana','list'][i] === mode);
  });
  if      (mode==='flash') renderFlash();
  else if (mode==='quiz')  renderQuiz('meaning');
  else if (mode==='kana')  renderQuiz('kana');
  else                     renderList();
}

/* ── Flashcard ── */
function renderFlash() {
  const area = document.getElementById('card-area');
  if (!curCards.length) { area.innerHTML='<div class="empty">沒有單字</div>'; return; }
  const card = curCards[curIdx];
  const pct  = Math.round((curIdx+1)/curCards.length*100);
  area.innerHTML = `
    <div class="fc-progress"><div class="fc-progress-bar" style="width:${pct}%"></div></div>
    <div class="flashcard" id="fc" onclick="flipCard()">
      <div class="fc-chapter-tag">${card.chapter}</div>
      <div class="fc-front">
        <div class="fc-verb">${card.name}</div>
        <div class="fc-kana">${card.kana}</div>
        <div class="fc-hint">點擊翻面查看意思</div>
      </div>
      <div class="fc-back">
        <div class="fc-meaning">${card.meaning}</div>
        <span class="badge ${card.type==='他動詞'?'badge-ta':'badge-ji'}">${card.type}</span>
        <div class="fc-example">${card.example}</div>
        <div class="fc-particle">接續助詞：<b>${card.particle}</b></div>
      </div>
    </div>
    <div class="fc-nav">
      <span class="fc-counter">${curIdx+1} / ${curCards.length}</span>
      <div class="fc-btns">
        <button class="btn" onclick="fcNav(-1)" ${curIdx===0?'disabled':''}>← 上一張</button>
        <button class="btn btn-dunno" onclick="markWrong()">不熟 ✗</button>
        <button class="btn btn-know"  onclick="markKnown()">記住了 ✓</button>
        <button class="btn" onclick="fcNav(1)"  ${curIdx===curCards.length-1?'disabled':''}>下一張 →</button>
      </div>
    </div>`;
}

function flipCard() { document.getElementById('fc').classList.toggle('flipped'); }
function fcNav(dir) {
  curIdx = Math.max(0, Math.min(curCards.length-1, curIdx+dir));
  renderFlash();
}
function markKnown() { known[curCards[curIdx].name]=true;  delete wrong[curCards[curIdx].name]; save(); fcNav(1); }
function markWrong() { wrong[curCards[curIdx].name]=true;  known[curCards[curIdx].name]=false;  save(); fcNav(1); }

/* ── Quiz ── */
function shuffle(arr) { return [...arr].sort(()=>Math.random()-.5); }
let curQuizType = 'meaning'; // 'meaning' or 'kana'

function renderQuiz(type) {
  if (type) curQuizType = type;
  if (curIdx >= curCards.length) { renderResult(); return; }
  const card   = curCards[curIdx];
  const others = allCards.filter(w => w.name !== card.name);
  const pool   = shuffle([card, ...shuffle(others).slice(0,3)]);
  quizOptNames = pool.map(o => o.name);

  const isMeaning = curQuizType === 'meaning';
  const qLabel  = isMeaning ? '這個複合動詞的中文意思是？' : '這個複合動詞的平假名讀音是？';
  const optText = (o) => isMeaning ? o.meaning : o.kana;

  const area = document.getElementById('card-area');
  area.innerHTML =
    '<div class="quiz-card">'
    + '<div class="quiz-top">'
    + '<span class="quiz-q">' + qLabel + '</span>'
    + '<span class="quiz-score-badge">得分 ' + quizScore + '/' + quizTotal + '</span>'
    + '</div>'
    + '<div class="quiz-verb">' + card.name + '</div>'
    + (isMeaning ? '<div class="quiz-kana">' + card.kana + '</div>' : '')
    + '<div class="quiz-opts">'
    + pool.map((o,i) => '<button class="quiz-opt" id="qo' + i + '" onclick="checkQuiz(' + i + ')">' + optText(o) + '</button>').join('')
    + '</div>'
    + '<div class="quiz-feedback" id="qfb"></div>'
    + '<button class="quiz-next" id="qnext" onclick="nextQuiz()">下一題 →</button>'
    + '</div>';
}

function checkQuiz(chosenIdx) {
  const card        = curCards[curIdx];
  const correctName = card.name;
  const correctIdx  = quizOptNames.indexOf(correctName);
  document.querySelectorAll('.quiz-opt').forEach(b => b.disabled = true);
  if (correctIdx >= 0) document.getElementById('qo'+correctIdx).classList.add('correct');

  const isCorrect = quizOptNames[chosenIdx] === correctName;
  const fb = document.getElementById('qfb');

  if (isCorrect) {
    quizScore++;
    fb.className = 'quiz-feedback show ok';
    fb.innerHTML = '✓ 正確！<br>例句：' + card.example;
    known[correctName] = true; delete wrong[correctName];
    // Auto-advance after 0.8s
    setTimeout(function() { curIdx++; renderQuiz(); }, 800);
  } else {
    document.getElementById('qo'+chosenIdx).classList.add('wrong');
    fb.className = 'quiz-feedback show ng';
    fb.innerHTML = '✗ 正確答案是「'
      + (curQuizType === 'meaning' ? card.meaning : card.kana)
      + '」<br>例句：' + card.example;
    wrong[correctName] = true; known[correctName] = false;
    document.getElementById('qnext').classList.add('show');
  }
  quizTotal++; save();
}

function nextQuiz() { curIdx++; renderQuiz(); }

function renderResult() {
  const pct = quizTotal ? Math.round(quizScore/quizTotal*100) : 0;
  document.getElementById('card-area').innerHTML = `
    <div class="result-card">
      <div class="result-score">${pct}%</div>
      <div class="result-label">本次測驗結果</div>
      <div class="result-grid">
        <div class="rs"><div class="n">${quizScore}</div><div class="l">答對</div></div>
        <div class="rs"><div class="n">${quizTotal-quizScore}</div><div class="l">答錯</div></div>
        <div class="rs"><div class="n">${quizTotal}</div><div class="l">總題數</div></div>
        <div class="rs"><div class="n">${totalKnown()}</div><div class="l">累計已記</div></div>
      </div>
      <div class="result-actions">
        <button class="btn btn-primary" onclick="setMode('quiz')">再測一次</button>
        <button class="btn" onclick="setMode('flash')">閃卡複習</button>
        <button class="btn btn-danger"  onclick="reviewWeak()">複習錯題</button>
      </div>
    </div>`;
  updateStats(); renderSidebar();
}

/* ── List ── */
function renderList() {
  const area = document.getElementById('card-area');
  area.innerHTML = `
    <div class="list-header">
      <div style="font-size:13px;color:var(--text3);white-space:nowrap">${curCards.length} 個單字</div>
      <input class="list-search" placeholder="搜尋…" oninput="filterList(this.value)">
    </div>
    <div id="list-body">${buildListItems(curCards)}</div>`;
}

function buildListItems(cards) {
  if (!cards.length) return '<div class="empty">沒有符合的單字</div>';
  return cards.map(card => `
    <div class="list-item">
      <div class="li-verb-wrap">
        <div class="li-verb">${card.name}</div>
        <div class="li-kana">${card.kana}</div>
      </div>
      <div class="li-body">
        <div class="li-meaning">${card.meaning}</div>
        <div class="li-ex">${card.example}</div>
        <div class="li-meta">
          <span class="li-badge ${card.type==='他動詞'?'li-ta':'li-ji'}">${card.type}</span>
          <span class="li-badge li-p">助詞：${card.particle}</span>
          <span class="li-badge li-p">${card.chapter}</span>
        </div>
      </div>
      <div class="li-check ${known[card.name]?'known':''}" onclick="toggleKnown('${card.name}')">✓</div>
    </div>`).join('');
}

function filterList(q) {
  const lower = q.toLowerCase();
  const filtered = curCards.filter(c =>
    c.name.includes(q) || c.kana.includes(q) ||
    c.meaning.includes(q) || c.example.includes(q)
  );
  document.getElementById('list-body').innerHTML = buildListItems(filtered);
}

function toggleKnown(name) {
  known[name] = !known[name];
  if (known[name]) delete wrong[name];
  save(); renderList(); updateStats(); renderSidebar();
}

/* ── Sidebar collapse ── */
function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const btn = document.getElementById('sidebar-toggle');
  const collapsed = sb.classList.toggle('collapsed');
  btn.textContent = collapsed ? '▶' : '◀';
  btn.title = collapsed ? '展開側欄' : '收合側欄';
  localStorage.setItem('vv_sidebar', collapsed ? '1' : '0');
}

/* ── Dark / light mode ── */
function toggleTheme() {
  const isDark = document.body.classList.toggle('dark');
  document.getElementById('theme-btn').textContent = isDark ? '☀️' : '🌙';
  localStorage.setItem('vv_dark', isDark ? '1' : '0');
}

/* Init */
function init() {
  // Restore theme
  if (localStorage.getItem('vv_dark') === '1') {
    document.body.classList.add('dark');
    const btn = document.getElementById('theme-btn');
    if (btn) btn.textContent = '☀️';
  }
  // Restore sidebar state
  if (localStorage.getItem('vv_sidebar') === '1') {
    const sb = document.getElementById('sidebar');
    const tbtn = document.getElementById('sidebar-toggle');
    if (sb) { sb.classList.add('collapsed'); }
    if (tbtn) { tbtn.textContent = '▶'; tbtn.title = '展開側欄'; }
  }
  renderSidebar();
  renderOverview();
  updateStats();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
<div class="toolbar">
  <button class="tool-btn" id="theme-btn" onclick="toggleTheme()" title="黑白模式">🌙</button>
</div>
</body>
</html>
