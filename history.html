<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="日本歷史人物學習工具，涵蓋古代到現代60位重要人物，支援卡片瀏覽、知識測驗、時間軸視覺化。">
<title>日本歴史人物事典｜にほんの偉人</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

:root {
  --ink: #1c1a17;
  --ink-soft: #3a352e;
  --paper: #ede7d9;
  --paper-deep: #e2dac8;
  --paper-card: #f7f3e8;
  --vermillion: #a8392a;
  --vermillion-soft: #c75a44;
  --vermillion-pale: #f3ddd6;
  --indigo: #2d4356;
  --indigo-soft: #43617a;
  --indigo-pale: #dde6ec;
  --gold: #a8842f;
  --gold-pale: #f1e6c8;
  --line: #d4c9ad;
  --line-soft: #e6dec8;
  --font-display: 'Shippori Mincho', 'Noto Serif TC', serif;
  --font-body: 'Noto Sans TC', 'Hiragino Sans', sans-serif;
}

body {
  font-family: var(--font-body);
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  overflow-x: hidden;
  transition: background 0.3s, color 0.3s;
  background-image:
    radial-gradient(circle at 15% 8%, rgba(168,57,42,0.04) 0%, transparent 35%),
    radial-gradient(circle at 85% 92%, rgba(45,67,86,0.04) 0%, transparent 35%);
}

/* ══ DARK MODE ══ */
body.dark {
  --ink: #ece6d8;
  --ink-soft: #c9c2ae;
  --paper: #15140f;
  --paper-deep: #0e0d09;
  --paper-card: #1e1c15;
  --vermillion: #d4604a;
  --vermillion-soft: #e07d68;
  --vermillion-pale: #2e1c17;
  --indigo: #6f93ad;
  --indigo-soft: #8babc4;
  --indigo-pale: #1a2630;
  --gold: #d4af5a;
  --gold-pale: #2a2412;
  --line: #3a3528;
  --line-soft: #2a2619;
}

/* ══ GRAYSCALE ══ */
body.grayscale { filter: grayscale(1); }

/* ══ Header ══ */
.app-header {
  background: var(--paper-card);
  border-bottom: 2px solid var(--ink);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 40;
}
.brand {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex: 1;
  min-width: 200px;
}
.brand-seal {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  background: var(--vermillion);
  color: var(--paper-card);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.05rem;
  border-radius: 4px;
  flex-shrink: 0;
  letter-spacing: -1px;
}
.brand h1 {
  font-family: var(--font-display);
  font-size: 1.3rem;
  font-weight: 700;
  letter-spacing: 0.02em;
}
.brand .sub {
  font-size: 0.72rem;
  color: var(--ink-soft);
  letter-spacing: 0.08em;
}
.header-stats {
  display: flex;
  gap: 8px;
  align-items: center;
  font-size: 0.78rem;
  font-family: var(--font-body);
}
.stat-pill {
  background: var(--paper-deep);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 12px;
  font-weight: 600;
  color: var(--ink-soft);
}
.stat-pill.correct { background: var(--gold-pale); color: var(--gold); border-color: var(--gold); }
.stat-pill.wrong { background: var(--vermillion-pale); color: var(--vermillion); border-color: var(--vermillion); }

.theme-toggle-group { display: flex; gap: 4px; }
.theme-btn {
  border: 1.5px solid var(--line);
  background: var(--paper-card);
  border-radius: 6px;
  width: 32px; height: 32px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-soft);
  transition: all 0.15s;
}
.theme-btn:hover { border-color: var(--ink-soft); }
.theme-btn.active { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.theme-btn svg { width: 16px; height: 16px; }

/* ══ Nav tabs ══ */
.nav-tabs {
  background: var(--paper-card);
  border-bottom: 1px solid var(--line);
  padding: 0 24px;
  display: flex;
  gap: 4px;
  overflow-x: auto;
  position: sticky;
  top: 67px;
  z-index: 39;
}
.nav-tab {
  border: none;
  background: none;
  padding: 12px 18px;
  font-family: var(--font-display);
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--ink-soft);
  cursor: pointer;
  white-space: nowrap;
  border-bottom: 3px solid transparent;
  transition: all 0.15s;
}
.nav-tab:hover { color: var(--ink); }
.nav-tab.active { color: var(--vermillion); border-bottom-color: var(--vermillion); }

/* ══ Filter bar ══ */
.filter-bar {
  background: var(--paper-deep);
  border-bottom: 1px solid var(--line);
  padding: 10px 24px;
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  align-items: center;
}
.filter-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.filter-label {
  font-size: 0.74rem;
  font-weight: 700;
  color: var(--ink-soft);
  letter-spacing: 0.06em;
  white-space: nowrap;
}
.chip {
  border: 1.5px solid var(--line);
  background: var(--paper-card);
  border-radius: 999px;
  padding: 4px 13px;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--ink-soft);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.chip:hover { border-color: var(--ink-soft); }
.chip.selected { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.chip.selected.era-tag { background: var(--vermillion); border-color: var(--vermillion); }
.chip.selected.field-tag { background: var(--indigo); border-color: var(--indigo); }

/* ══ Main area ══ */
.main { padding: 24px; max-width: 1100px; margin: 0 auto; }
.empty-state { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
.empty-state .big { font-size: 2.4rem; margin-bottom: 10px; opacity: 0.5; }

/* ══ CARD GRID VIEW ══ */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
}
.figure-card {
  background: var(--paper-card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 0;
  cursor: pointer;
  transition: all 0.2s;
  overflow: hidden;
  position: relative;
}
.figure-card:hover {
  border-color: var(--vermillion);
  box-shadow: 0 6px 20px rgba(28,26,23,0.1);
  transform: translateY(-2px);
}
.fc-era-bar {
  height: 5px;
  width: 100%;
}
.fc-body { padding: 16px 18px; }
.fc-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.fc-name-wrap { display: flex; flex-direction: column; }
.fc-reading { font-size: 0.7rem; color: var(--ink-soft); letter-spacing: 0.04em; }
.fc-name { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; margin-top: 1px; }
.fc-years { font-size: 0.72rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; margin-top: 3px; }
.fc-oneline { font-size: 0.83rem; color: var(--ink-soft); line-height: 1.55; margin-top: 8px; }
.fc-tags { display: flex; gap: 5px; margin-top: 12px; flex-wrap: wrap; }
.fc-tag { font-size: 0.68rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; }

/* ══ DETAIL MODAL/PANEL ══ */
.detail-overlay {
  position: fixed; inset: 0;
  background: rgba(28,26,23,0.6);
  z-index: 100;
  display: flex; align-items: flex-start; justify-content: center;
  padding: 30px 16px;
  overflow-y: auto;
  animation: fadeIn 0.2s;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.detail-panel {
  background: var(--paper-card);
  border-radius: 14px;
  max-width: 680px;
  width: 100%;
  margin: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  position: relative;
}
.detail-close {
  position: absolute; top: 16px; right: 16px;
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--paper-deep);
  border: 1px solid var(--line);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem;
  color: var(--ink-soft);
  z-index: 5;
}
.detail-close:hover { background: var(--ink); color: var(--paper); }
.detail-header {
  padding: 32px 32px 20px;
  border-bottom: 1px solid var(--line);
}
.detail-reading { font-size: 0.85rem; color: var(--ink-soft); letter-spacing: 0.06em; }
.detail-name { font-family: var(--font-display); font-size: 2.1rem; font-weight: 700; margin-top: 2px; }
.detail-romaji { font-size: 0.8rem; color: var(--ink-soft); font-style: italic; margin-top: 2px; }
.detail-meta-row { display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
.detail-years { font-size: 0.85rem; font-weight: 600; color: var(--ink-soft); }
.detail-oneline {
  font-size: 0.95rem; color: var(--ink); margin-top: 12px; line-height: 1.6;
  padding: 10px 14px; background: var(--paper-deep); border-radius: 8px;
  border-left: 3px solid var(--vermillion);
}
.detail-body { padding: 24px 32px 32px; }
.detail-section { margin-bottom: 22px; }
.detail-section-title {
  font-family: var(--font-display);
  font-size: 0.95rem; font-weight: 700; color: var(--vermillion);
  margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
}
.detail-section-title::before { content: '◆'; font-size: 0.6rem; }
.detail-text { font-size: 0.92rem; line-height: 1.85; color: var(--ink); text-align: justify; }
.detail-quote {
  font-family: var(--font-display);
  font-size: 1.05rem;
  color: var(--indigo);
  text-align: center;
  padding: 16px 20px;
  background: var(--indigo-pale);
  border-radius: 8px;
  margin-top: 6px;
  line-height: 1.7;
}
.detail-related { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.related-chip {
  border: 1px solid var(--line);
  background: var(--paper-deep);
  border-radius: 999px;
  padding: 5px 14px;
  font-size: 0.82rem;
  cursor: pointer;
  color: var(--ink-soft);
  transition: all 0.15s;
}
.related-chip:hover { border-color: var(--indigo); color: var(--indigo); background: var(--indigo-pale); }

/* ══ QUIZ MODE ══ */
.quiz-card {
  background: var(--paper-card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 32px;
  max-width: 600px;
  margin: 0 auto;
}
.quiz-progress-row { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
.progress-bar-bg { flex: 1; height: 7px; background: var(--paper-deep); border-radius: 999px; overflow: hidden; }
.progress-bar-fill { height: 100%; background: var(--vermillion); border-radius: 999px; transition: width 0.3s; }
.progress-label { font-size: 0.78rem; color: var(--ink-soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
.quiz-q-type { font-size: 0.74rem; font-weight: 700; color: var(--indigo); letter-spacing: 0.06em; margin-bottom: 10px; }
.quiz-question { font-size: 1.15rem; line-height: 1.7; margin-bottom: 22px; color: var(--ink); }
.quiz-question strong { color: var(--vermillion); }
.quiz-options { display: flex; flex-direction: column; gap: 10px; }
.quiz-option {
  border: 1.5px solid var(--line);
  background: var(--paper-deep);
  border-radius: 10px;
  padding: 13px 18px;
  font-size: 0.95rem;
  text-align: left;
  cursor: pointer;
  transition: all 0.15s;
  color: var(--ink);
}
.quiz-option:hover { border-color: var(--indigo); }
.quiz-option.correct-option { background: var(--gold-pale); border-color: var(--gold); color: var(--gold); font-weight: 700; }
.quiz-option.wrong-option { background: var(--vermillion-pale); border-color: var(--vermillion); color: var(--vermillion); font-weight: 700; }
.quiz-option.disabled { pointer-events: none; opacity: 0.6; }
.quiz-option.disabled.correct-option, .quiz-option.disabled.wrong-option { opacity: 1; }
.quiz-feedback { margin-top: 16px; font-size: 0.88rem; line-height: 1.6; color: var(--ink-soft); min-height: 20px; }
.btn-next-q {
  margin-top: 18px;
  background: var(--ink);
  color: var(--paper);
  border: none;
  border-radius: 10px;
  padding: 11px 28px;
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: none;
}
.btn-next-q:hover { background: var(--vermillion); }
.done-state { text-align: center; padding: 30px 10px; }
.done-state .big { font-size: 3rem; margin-bottom: 10px; }
.done-state h2 { font-family: var(--font-display); font-size: 1.4rem; margin-bottom: 8px; }
.done-state p { color: var(--ink-soft); margin-bottom: 22px; }
.btn-restart {
  background: var(--ink); color: var(--paper); border: none; border-radius: 10px;
  padding: 12px 30px; font-size: 0.95rem; font-weight: 700; cursor: pointer;
}
.btn-restart:hover { background: var(--vermillion); }

/* ══ TIMELINE VIEW ══ */
.timeline-wrap { position: relative; padding: 20px 0 40px; }
.timeline-spine {
  position: absolute;
  left: 50%;
  top: 0; bottom: 0;
  width: 3px;
  background: linear-gradient(to bottom, var(--vermillion), var(--indigo));
  transform: translateX(-50%);
}
.timeline-era-marker {
  text-align: center;
  margin: 36px 0 20px;
  position: relative;
}
.timeline-era-marker .era-stamp {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  background: var(--paper);
  padding: 6px 22px;
  position: relative;
  z-index: 2;
}
.timeline-era-marker .era-name {
  font-family: var(--font-display);
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--vermillion);
  border: 2px solid var(--vermillion);
  border-radius: 6px;
  padding: 4px 16px;
  background: var(--paper-card);
}
.timeline-era-marker .era-range {
  font-size: 0.72rem;
  color: var(--ink-soft);
  margin-top: 4px;
}
.timeline-item {
  display: flex;
  width: 100%;
  margin-bottom: 14px;
  position: relative;
}
.timeline-item.left { justify-content: flex-end; }
.timeline-item.right { justify-content: flex-start; }
.timeline-item .ti-card {
  width: calc(50% - 28px);
  background: var(--paper-card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 16px;
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
}
.timeline-item .ti-card:hover { border-color: var(--vermillion); box-shadow: 0 4px 14px rgba(28,26,23,0.1); }
.timeline-item .ti-year { font-size: 0.7rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.timeline-item .ti-name { font-family: var(--font-display); font-size: 1.05rem; font-weight: 700; margin-top: 1px; }
.timeline-item .ti-oneline { font-size: 0.78rem; color: var(--ink-soft); margin-top: 4px; line-height: 1.5; }
.timeline-dot {
  position: absolute;
  left: 50%;
  top: 18px;
  width: 11px; height: 11px;
  background: var(--paper);
  border: 3px solid var(--indigo);
  border-radius: 50%;
  transform: translateX(-50%);
  z-index: 3;
}

@media (max-width: 720px) {
  .timeline-spine { left: 18px; }
  .timeline-item.left, .timeline-item.right { justify-content: flex-start; }
  .timeline-item .ti-card { width: calc(100% - 46px); margin-left: 40px; }
  .timeline-dot { left: 18px; }
  .detail-header, .detail-body { padding-left: 20px; padding-right: 20px; }
}

@media (max-width: 600px) {
  .app-header { padding: 12px 14px; }
  .nav-tabs { padding: 0 14px; top: 60px; }
  .filter-bar { padding: 8px 14px; }
  .main { padding: 14px; }
  .card-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .fc-body { padding: 12px 13px; }
  .fc-name { font-size: 1.05rem; }
  .detail-name { font-size: 1.6rem; }
}
@media (max-width: 420px) {
  .card-grid { grid-template-columns: 1fr; }
}

/* Furigana tooltip for quote readings (reuse fg pattern if needed later) */
.search-input {
  width: 100%;
  border: 1.5px solid var(--line);
  background: var(--paper-card);
  border-radius: 10px;
  padding: 10px 16px;
  font-size: 0.95rem;
  outline: none;
  font-family: inherit;
  color: var(--ink);
  margin-bottom: 18px;
  transition: border 0.15s;
}
.search-input:focus { border-color: var(--vermillion); }
</style>
</head>
<body>

<div class="app-header">
  <div class="brand">
    <span class="brand-seal">史</span>
    <div>
      <h1>日本歴史人物事典</h1>
      <div class="sub">60位日本歴史上の人物 ／ 古代～現代</div>
    </div>
  </div>
  <div class="header-stats">
    <span class="stat-pill correct" id="stat-correct">✓ 0</span>
    <span class="stat-pill wrong" id="stat-wrong">✗ 0</span>
  </div>
  <div class="theme-toggle-group">
    <button class="theme-btn active" id="theme-light" onclick="setTheme('light')" title="亮色模式">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>
    <button class="theme-btn" id="theme-dark" onclick="setTheme('dark')" title="深色模式">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <button class="theme-btn" id="theme-gray" onclick="setTheme('gray')" title="黑白模式">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
    </button>
  </div>
</div>

<div class="nav-tabs">
  <button class="nav-tab active" data-view="cards" onclick="setView('cards')">人物卡片</button>
  <button class="nav-tab" data-view="quiz" onclick="setView('quiz')">知識測驗</button>
  <button class="nav-tab" data-view="timeline" onclick="setView('timeline')">時間軸</button>
</div>

<div id="filter-area"></div>
<div class="main" id="main-area"></div>

<script>
// ══════════════════════════════════════════
//  日本歷史人物資料庫
//  時代分類: kodai(古代) asuka(飛鳥) nara(奈良) heian(平安)
//  sengoku(戰國) edo(江戸) meiji(明治) modern(近現代)
//  領域分類: military(武將) politics(政治) culture(文化藝術)
//  religion(宗教思想) science(科學技術) reform(改革維新)
// ══════════════════════════════════════════

const FIGURES = [
// ─────────── 古代・飛鳥・奈良 ───────────
{
  id: 'shotoku',
  name: '聖徳太子', reading: 'しょうとくたいし', romaji: 'Shōtoku Taishi',
  zh: '聖德太子', era: 'asuka', field: ['politics','religion'],

let currentView = 'cards';
let selectedEras = new Set(Object.keys(ERA_LABELS));
let selectedFields = new Set(Object.keys(FIELD_LABELS));
let searchQuery = '';

let quizQueue = [];
let quizIdx = 0;
let quizCorrect = 0;
let quizWrong = 0;
let quizAnswered = false;

// ══════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════
function getFilteredFigures() {
  return FIGURES.filter(f => {
    if (!selectedEras.has(f.era)) return false;
    if (!f.field.some(fl => selectedFields.has(fl))) return false;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      const hay = (f.name + f.reading + f.zh + f.oneline).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function eraFieldChipsHTML() {
  let eraChips = Object.keys(ERA_LABELS).map(e => {
    const sel = selectedEras.has(e) ? 'selected era-tag' : '';
    return `<span class="chip ${sel}" data-era="${e}" onclick="toggleEra('${e}')">${ERA_LABELS[e].label}</span>`;
  }).join('');
  let fieldChips = Object.keys(FIELD_LABELS).map(fl => {
    const sel = selectedFields.has(fl) ? 'selected field-tag' : '';
    return `<span class="chip ${sel}" data-field="${fl}" onclick="toggleField('${fl}')">${FIELD_LABELS[fl].label}</span>`;
  }).join('');
  return `
  <div class="filter-bar">
    <div class="filter-group">
      <span class="filter-label">時代</span>
      ${eraChips}
    </div>
    <div class="filter-group">
      <span class="filter-label">領域</span>
      ${fieldChips}
    </div>
  </div>`;
}

function toggleEra(e) {
  if (selectedEras.has(e)) { if (selectedEras.size > 1) selectedEras.delete(e); }
  else selectedEras.add(e);
  render();
}
function toggleField(f) {
  if (selectedFields.has(f)) { if (selectedFields.size > 1) selectedFields.delete(f); }
  else selectedFields.add(f);
  render();
}

function setView(v) {
  currentView = v;
  if (v === 'quiz') startQuiz();
  render();
}

// ══════════════════════════════════════════
//  RENDER: TOP LEVEL
// ══════════════════════════════════════════
function render() {
  document.querySelectorAll('.nav-tab').forEach(el => {
    el.classList.toggle('active', el.dataset.view === currentView);
  });

  const filterArea = document.getElementById('filter-area');
  const main = document.getElementById('main-area');

  if (currentView === 'cards') {
    filterArea.innerHTML = eraFieldChipsHTML() + `<div style="padding:16px 24px 0"><input class="search-input" id="search-input" placeholder="搜尋人物姓名或關鍵字…" value="${searchQuery}" oninput="onSearch(this.value)"></div>`;
    renderCards(main);
  } else if (currentView === 'quiz') {
    filterArea.innerHTML = eraFieldChipsHTML();
    renderQuiz(main);
  } else if (currentView === 'timeline') {
    filterArea.innerHTML = eraFieldChipsHTML();
    renderTimeline(main);
  }
}

function onSearch(v) {
  searchQuery = v;
  const main = document.getElementById('main-area');
  renderCards(main);
  // keep focus
  const inp = document.getElementById('search-input');
  if (inp) { inp.focus(); inp.setSelectionRange(v.length, v.length); }
}

// ══════════════════════════════════════════
//  RENDER: CARD GRID
// ══════════════════════════════════════════
function renderCards(main) {
  const figures = getFilteredFigures();
  if (figures.length === 0) {
    main.innerHTML = `<div class="empty-state"><p>沒有符合條件的人物，請調整篩選範圍</p></div>`;
    return;
  }
  const cardsHTML = figures.map(f => {
    const era = ERA_LABELS[f.era];
    const tagsHTML = f.field.map(fl => {
      const fd = FIELD_LABELS[fl];
      return `<span class="fc-tag" style="background:${era.color}18;color:${era.color}">${fd.label}</span>`;
    }).join('');
    return `
    <div class="figure-card" onclick="openDetail('${f.id}')">
      <div class="fc-era-bar" style="background:${era.color}"></div>
      <div class="fc-body">
        <div class="fc-top">
          <div class="fc-name-wrap">
            <span class="fc-reading">${f.reading}</span>
            <span class="fc-name">${f.name}</span>
          </div>
          <span class="fc-years">${f.years}</span>
        </div>
        <div class="fc-oneline">${f.oneline}</div>
        <div class="fc-tags">${tagsHTML}</div>
      </div>
    </div>`;
  }).join('');
  main.innerHTML = `<div class="card-grid">${cardsHTML}</div>`;
}

// ══════════════════════════════════════════
//  RENDER: DETAIL PANEL
// ══════════════════════════════════════════
function openDetail(id) {
  const f = FIGURE_MAP[id];
  if (!f) return;
  const era = ERA_LABELS[f.era];
  const fieldTags = f.field.map(fl => {
    const fd = FIELD_LABELS[fl];
    return `<span class="fc-tag" style="background:${era.color}18;color:${era.color}">${fd.label}</span>`;
  }).join('');

  const relatedHTML = (f.related && f.related.length) ? `
    <div class="detail-section">
      <div class="detail-section-title">相關人物</div>
      <div class="detail-related">
        ${f.related.map(rid => {
          const rf = FIGURE_MAP[rid];
          return rf ? `<span class="related-chip" onclick="openDetail('${rid}')">${rf.name}</span>` : '';
        }).join('')}
      </div>
    </div>` : '';

  const quoteHTML = f.quote ? `
    <div class="detail-section">
      <div class="detail-section-title">名言</div>
      <div class="detail-quote">「${f.quote}」</div>
    </div>` : '';

  const overlay = document.createElement('div');
  overlay.className = 'detail-overlay';
  overlay.id = 'detail-overlay';
  overlay.onclick = (e) => { if (e.target === overlay) closeDetail(); };
  overlay.innerHTML = `
    <div class="detail-panel">
      <button class="detail-close" onclick="closeDetail()">✕</button>
      <div class="detail-header">
        <div class="detail-reading">${f.reading}</div>
        <div class="detail-name">${f.name}<span style="font-size:0.6em;color:var(--ink-soft);font-weight:400;margin-left:10px">${f.zh}</span></div>
        <div class="detail-romaji">${f.romaji}</div>
        <div class="detail-meta-row">
          <span class="detail-years">${f.years}</span>
          <span class="chip era-tag selected" style="background:${era.color};border-color:${era.color}">${era.label}</span>
          ${fieldTags}
        </div>
        <div class="detail-oneline">${f.oneline}</div>
      </div>
      <div class="detail-body">
        <div class="detail-section">
          <div class="detail-section-title">生平故事</div>
          <div class="detail-text">${f.story}</div>
        </div>
        <div class="detail-section">
          <div class="detail-section-title">歷史評價與影響</div>
          <div class="detail-text">${f.legacy}</div>
        </div>
        ${quoteHTML}
        ${relatedHTML}
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.body.style.overflow = 'hidden';
}

function closeDetail() {
  const overlay = document.getElementById('detail-overlay');
  if (overlay) overlay.remove();
  document.body.style.overflow = '';
}

// ══════════════════════════════════════════
//  RENDER: TIMELINE
// ══════════════════════════════════════════
function renderTimeline(main) {
  const figures = getFilteredFigures().slice().sort((a,b) => a.yearStart - b.yearStart);
  if (figures.length === 0) {
    main.innerHTML = `<div class="empty-state"><p>沒有符合條件的人物，請調整篩選範圍</p></div>`;
    return;
  }
  let html = '<div class="timeline-wrap"><div class="timeline-spine"></div>';
  let lastEra = null;
  let side = 'left';
  figures.forEach((f, i) => {
    if (f.era !== lastEra) {
      const era = ERA_LABELS[f.era];
      html += `<div class="timeline-era-marker"><div class="era-stamp"><span class="era-name" style="color:${era.color};border-color:${era.color}">${era.label}</span><span class="era-range">${era.range}</span></div></div>`;
      lastEra = f.era;
    }
    side = side === 'left' ? 'right' : 'left';
    const era = ERA_LABELS[f.era];
    html += `
    <div class="timeline-item ${side}">
      <div class="timeline-dot" style="border-color:${era.color}"></div>
      <div class="ti-card" onclick="openDetail('${f.id}')">
        <div class="ti-year">${f.years}</div>
        <div class="ti-name">${f.name}<span style="font-size:0.75rem;color:var(--ink-soft);font-weight:400;margin-left:6px">${f.reading}</span></div>
        <div class="ti-oneline">${f.oneline}</div>
      </div>
    </div>`;
  });
  html += '</div>';
  main.innerHTML = html;
}
// ══════════════════════════════════════════
//  QUIZ LOGIC
// ══════════════════════════════════════════

const QUIZ_TYPES = ['name-to-era', 'name-to-field', 'oneline-to-name', 'years-to-name', 'quote-to-name'];

function shuffleArr(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickRandom(arr, n, excludeIds=[]) {
  const pool = arr.filter(x => !excludeIds.includes(x.id));
  return shuffleArr(pool).slice(0, n);
}

function buildQuizQuestion(figure, pool) {
  // choose a quiz type; quote type only if figure has a quote
  let availableTypes = QUIZ_TYPES.filter(t => t !== 'quote-to-name' || figure.quote);
  const type = availableTypes[Math.floor(Math.random() * availableTypes.length)];

  if (type === 'name-to-era') {
    const correctEra = ERA_LABELS[figure.era].label;
    const otherEras = shuffleArr(Object.keys(ERA_LABELS).filter(e => e !== figure.era))
      .slice(0, 3).map(e => ERA_LABELS[e].label);
    const options = shuffleArr([correctEra, ...otherEras]);
    return {
      qType: '時代判斷',
      question: `「<strong>${figure.name}</strong>」（${figure.reading}）屬於哪個時代？`,
      options, correct: correctEra,
      explain: `${figure.name}：${figure.oneline}`
    };
  }
  if (type === 'name-to-field') {
    const correctField = FIELD_LABELS[figure.field[0]].label;
    const otherFields = shuffleArr(Object.keys(FIELD_LABELS).filter(fl => fl !== figure.field[0]))
      .slice(0, 3).map(fl => FIELD_LABELS[fl].label);
    const options = shuffleArr([correctField, ...otherFields]);
    return {
      qType: '領域判斷',
      question: `「<strong>${figure.name}</strong>」最主要的身分／領域是？`,
      options, correct: correctField,
      explain: `${figure.name}：${figure.oneline}`
    };
  }
  if (type === 'oneline-to-name') {
    const distractors = pickRandom(pool, 3, [figure.id]).map(f => f.name);
    const options = shuffleArr([figure.name, ...distractors]);
    return {
      qType: '人物辨識',
      question: `下列哪位人物符合敘述：「${figure.oneline}」？`,
      options, correct: figure.name,
      explain: `${figure.name}（${figure.reading}）：${figure.years}`
    };
  }
  if (type === 'years-to-name') {
    const distractors = pickRandom(pool.filter(f => f.era === figure.era), 3, [figure.id]);
    const finalDistractors = distractors.length >= 3 ? distractors : pickRandom(pool, 3, [figure.id]);
    const options = shuffleArr([figure.name, ...finalDistractors.slice(0,3).map(f=>f.name)]);
    return {
      qType: '年代配對',
      question: `生卒年為「<strong>${figure.years}</strong>」的人物是？`,
      options, correct: figure.name,
      explain: `${figure.name}：${figure.oneline}`
    };
  }
  if (type === 'quote-to-name') {
    const distractors = pickRandom(pool, 3, [figure.id]).map(f => f.name);
    const options = shuffleArr([figure.name, ...distractors]);
    return {
      qType: '名言配對',
      question: `「${figure.quote}」是誰留下的名言？`,
      options, correct: figure.name,
      explain: `${figure.name}：${figure.oneline}`
    };
  }
}

function startQuiz() {
  const pool = getFilteredFigures();
  if (pool.length < 4) {
    quizQueue = [];
    return;
  }
  quizQueue = shuffleArr(pool).map(f => buildQuizQuestion(f, pool));
  quizIdx = 0;
  quizCorrect = 0;
  quizWrong = 0;
  quizAnswered = false;
  updateQuizStats();
}

function updateQuizStats() {
  const c = document.getElementById('stat-correct');
  const w = document.getElementById('stat-wrong');
  if (c) c.textContent = '✓ ' + quizCorrect;
  if (w) w.textContent = '✗ ' + quizWrong;
}

function renderQuiz(main) {
  if (quizQueue.length === 0) {
    main.innerHTML = `<div class="empty-state"><p>請至少選擇涵蓋 4 位以上人物的篩選範圍才能開始測驗</p></div>`;
    return;
  }
  if (quizIdx >= quizQueue.length) {
    renderQuizDone(main);
    return;
  }
  const q = quizQueue[quizIdx];
  const progress = `<div class="quiz-progress-row">
    <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${(quizIdx/quizQueue.length*100).toFixed(1)}%"></div></div>
    <span class="progress-label">${quizIdx}／${quizQueue.length}</span>
  </div>`;
  const optionsHTML = q.options.map(opt => `<button class="quiz-option" onclick="answerQuiz(this, '${escapeQ(opt)}')">${opt}</button>`).join('');

  main.innerHTML = `
  <div class="quiz-card">
    ${progress}
    <div class="quiz-q-type">${q.qType}</div>
    <div class="quiz-question">${q.question}</div>
    <div class="quiz-options" id="quiz-options">${optionsHTML}</div>
    <div class="quiz-feedback" id="quiz-feedback"></div>
    <button class="btn-next-q" id="btn-next-q" onclick="nextQuizQ()">下一題 →</button>
  </div>`;
}

function escapeQ(s) {
  return s.replace(/'/g, "\\'").replace(/"/g,'&quot;');
}

function answerQuiz(btn, val) {
  if (quizAnswered) return;
  quizAnswered = true;
  const q = quizQueue[quizIdx];
  const opts = document.querySelectorAll('#quiz-options .quiz-option');
  opts.forEach(o => {
    o.classList.add('disabled');
    if (o.textContent === q.correct) o.classList.add('correct-option');
  });
  const fb = document.getElementById('quiz-feedback');
  if (val === q.correct) {
    quizCorrect++;
    fb.innerHTML = `<strong style="color:var(--gold)">✓ 正確！</strong> ${q.explain}`;
  } else {
    quizWrong++;
    btn.classList.add('wrong-option');
    fb.innerHTML = `<strong style="color:var(--vermillion)">✗ 不正確</strong>　正確答案：${q.correct}<br>${q.explain}`;
  }
  updateQuizStats();
  document.getElementById('btn-next-q').style.display = 'inline-block';
}

function nextQuizQ() {
  quizIdx++;
  quizAnswered = false;
  renderQuiz(document.getElementById('main-area'));
}

function renderQuizDone(main) {
  const total = quizCorrect + quizWrong;
  const pct = total > 0 ? Math.round(quizCorrect / total * 100) : 0;
  main.innerHTML = `
  <div class="quiz-card">
    <div class="done-state">
      <h2>測驗完成！</h2>
      <p>答對 ${quizCorrect} 題，答錯 ${quizWrong} 題（正確率 ${pct}%）</p>
      <button class="btn-restart" onclick="startQuiz(); renderQuiz(document.getElementById('main-area'))">重新測驗</button>
    </div>
  </div>`;
}
// ══════════════════════════════════════════
//  THEME
// ══════════════════════════════════════════
function setTheme(t) {
  document.body.classList.remove('dark', 'grayscale');
  if (t === 'dark') document.body.classList.add('dark');
  else if (t === 'gray') document.body.classList.add('grayscale');
  ['light','dark','gray'].forEach(x => {
    const el = document.getElementById('theme-'+x);
    if (el) el.classList.toggle('active', x === t);
  });
  try { localStorage.setItem('jpfig-theme', t); } catch(e) {}
}

(function(){
  try {
    const saved = localStorage.getItem('jpfig-theme');
    if (saved) setTheme(saved);
  } catch(e) {}
})();

render();
</script>
